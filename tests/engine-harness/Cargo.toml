[package]
name = "qzz-engine-tests"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
tokio = {version="1",features=["process","time","sync","io-util","rt-multi-thread","macros"]}
[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61.2",features=["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_System_LibraryLoader","Win32_System_Threading"]}
